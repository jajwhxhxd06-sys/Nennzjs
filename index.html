<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWILL · Meta Extractor</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/exifr.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>⬡ SWILL · META RIP</h1>
            <p class="sub">Извлечение EXIF / IPTC / XMP из фото (клиент, 0 серверов)</p>
        </header>

        <div class="upload-area" id="dropZone">
            <div class="icon">🖼️</div>
            <p><strong>Кликни или перетащи файл</strong></p>
            <p class="hint">Поддерживаются .jpg, .jpeg, .tiff, .png, .webp</p>
            <p class="file-name" id="fileName">Файл не выбран</p>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.tiff,.tif,.webp" />
        </div>

        <div class="preview-row" id="previewRow" style="display: none;">
            <div class="preview-col">
                <img id="previewImg" src="" alt="превью" />
            </div>
            <div class="preview-col">
                <div class="stats" id="statsBar"></div>
                <div class="meta-output" id="metaOutput">⏳ Ожидание...</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="copyBtn">📋 Копировать мета</button>
            <button class="btn btn-danger" id="clearBtn">✕ Очистить</button>
            <button class="btn" id="downloadBtn">⬇ Скачать JSON</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
