<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWILL Metadata Extractor</title>
    <!-- Подключаем exifr для чтения метаданных из файла -->
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/exifr.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #1a1f2a;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2e3748;
        }
        h1 {
            color: #b9e2fa;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .sub {
            color: #7b8ba3;
            margin-bottom: 30px;
            border-left: 3px solid #3b8cbf;
            padding-left: 16px;
        }
        .upload-area {
            border: 2px dashed #3b4a5e;
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            color: #b0c4de;
            background: #11161f;
            transition: 0.25s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #5f8fc9;
            background: #171f2b;
        }
        .upload-area input {
            display: none;
        }
        .upload-area .icon {
            font-size: 4rem;
            margin-bottom: 12px;
        }
        .file-name {
            color: #c8daf0;
            font-weight: 500;
            margin-top: 10px;
        }
        .preview-row {
            display: flex;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .preview-col {
            flex: 1 1 280px;
        }
        .preview-col img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 16px;
            border: 1px solid #2e3c4f;
            background: #0a0e14;
            display: block;
        }
        .meta-output {
            background: #0d121b;
            border-radius: 18px;
            padding: 20px;
            border: 1px solid #293544;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            color: #d6e5f5;
            line-height: 1.6;
        }
        .meta-output .tag {
            color: #8ab3e0;
        }
        .meta-output .value {
            color: #e2c08d;
        }
        .meta-output .empty {
            color: #5f6f82;
            font-style: italic;
        }
        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .btn {
            background: #2b3a4e;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #3e516a;
        }
        .btn-primary {
            background: #1f6da9;
            border-color: #3d8fd6;
        }
        .btn-primary:hover {
            background: #2a7fc2;
        }
        .btn-danger {
            background: #712e3b;
            border-color: #a54355;
        }
        .btn-danger:hover {
            background: #8f3b4b;
        }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 18px 0 10px;
            color: #8fa3c0;
            font-size: 0.9rem;
        }
        .stats span {
            background: #1b2330;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #2e3f55;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #131b25;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f5777;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⬡ SWILL · META RIP</h1>
    <div class="sub">Извлечение EXIF / IPTC / XMP из файла фотографии (клиент, без сервера)</div>

    <div class="upload-area" id="dropZone">
        <div class="icon">🖼️</div>
        <div><strong>Кликни или перетащи файл</strong></div>
        <div style="font-size:0.9rem; color:#687b95; margin-top:6px;">Поддерживаются .jpg, .jpeg, .tiff, .png (с мета)</div>
        <div class="file-name" id="fileName">Файл не выбран</div>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.tiff,.tif,.webp">
    </div>

    <div class="preview-row" id="previewRow" style="display:none;">
        <div class="preview-col">
            <img id="previewImg" src="" alt="превью">
        </div>
        <div class="preview-col" style="flex:2;">
            <div class="stats" id="statsBar"></div>
            <div class="meta-output" id="metaOutput">Ожидание загрузки...</div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="copyBtn">📋 Копировать метаданные</button>
        <button class="btn btn-danger" id="clearBtn">✕ Очистить</button>
