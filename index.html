<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWILL · XP Meta Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/exifr.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* === Стиль Windows XP === */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #3a6ea5;
            font-family: Tahoma, 'Segoe UI', sans-serif;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .xp-desktop {
            width: 1300px;
            max-width: 100%;
            background: #3a6ea5;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 2px solid #0a246a;
            position: relative;
        }
        /* Заголовок окна */
        .xp-titlebar {
            background: linear-gradient(180deg, #1a5a9e 0%, #0a3a7a 100%);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0a246a;
            cursor: default;
            user-select: none;
            border-radius: 6px 6px 0 0;
        }
        .xp-titlebar .title {
            color: white;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .xp-titlebar .title img {
            width: 18px;
            height: 18px;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
        }
        .xp-titlebar .controls {
            display: flex;
            gap: 4px;
        }
        .xp-titlebar .controls button {
            width: 22px;
            height: 22px;
            border: 1px solid #0a246a;
            background: #b0b0b0;
            color: #000;
            font-weight: bold;
            font-size: 13px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            border-radius: 2px;
            box-shadow: inset 0 1px 0 #fff, 0 1px 0 #000;
            transition: 0.05s;
        }
        .xp-titlebar .controls button:hover { background: #e0e0e0; }
        .xp-titlebar .controls .close { background: #d04040; color: #fff; border-color: #8a2020; }
        .xp-titlebar .controls .close:hover { background: #ff6060; }

        /* Тело окна */
        .xp-window {
            background: #d4d0c8;
            padding: 12px;
            border-radius: 0 0 6px 6px;
            border-left: 2px solid #0a246a;
            border-right: 2px solid #0a246a;
            border-bottom: 2px solid #0a246a;
        }
        .xp-panel {
            background: #d4d0c8;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 10px;
            margin-bottom: 10px;
        }
        .xp-panel-title {
            background: #d4d0c8;
            font-weight: bold;
            font-size: 12px;
            color: #1a3a6a;
            padding: 2px 6px;
            border-bottom: 1px solid #a0a0a0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .xp-panel-title img { width: 16px; height: 16px; }

        .xp-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .xp-col {
            flex: 1;
            min-width: 280px;
        }

        /* Upload area */
        .xp-drop {
            border: 2px dashed #808080;
            background: #e8e4dc;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            border-radius: 4px;
        }
        .xp-drop:hover { background: #f0ece4; border-color: #3a6ea5; }
        .xp-drop input { display: none; }
        .xp-drop .icon { font-size: 42px; line-height: 1; }
        .xp-drop .filename { color: #1a3a6a; font-weight: bold; margin-top: 4px; }

        /* Preview */
        .xp-preview {
            max-width: 100%;
            max-height: 320px;
            border: 2px solid #808080;
            border-color: #808080 #fff #fff #808080;
            background: #c0c0c0;
            display: none;
            margin: 8px 0;
            border-radius: 2px;
        }

        /* Meta box */
        .xp-meta {
            background: #f0ece4;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 8px;
            max-height: 380px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
            color: #1a1a1a;
            border-radius: 2px;
        }
        .xp-meta .tag { color: #1a5a9e; font-weight: bold; }
        .xp-meta .value { color: #2a4a2a; }
        .xp-meta .section { color: #8a2a2a; font-weight: bold; display: block; margin-top: 6px; }

        /* Кнопки XP */
        .xp-btn {
            background: #d4d0c8;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 4px 18px;
            font-family: Tahoma, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: 0.05s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 26px;
        }
        .xp-btn:active {
            border-color: #808080 #fff #fff #808080;
        }
        .xp-btn-primary { background: #3a7a3a; color: #fff; border-color: #5a9a5a #1a4a1a #1a4a1a #5a9a5a; }
        .xp-btn-primary:active { border-color: #1a4a1a #5a9a5a #5a9a5a #1a4a1a; }
        .xp-btn-danger { background: #9a3a3a; color: #fff; border-color: #ba5a5a #6a1a1a #6a1a1a #ba5a5a; }
        .xp-btn-danger:active { border-color: #6a1a1a #ba5a5a #ba5a5a #6a1a1a; }
        .xp-btn-warning { background: #c09a2a; color: #fff; border-color: #daba4a #8a6a1a #8a6a1a #daba4a; }
        .xp-btn-warning:active { border-color: #8a6a1a #daba4a #daba4a #8a6a1a; }

        .xp-btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

        /* Status bar */
        .xp-status {
            background: #d4d0c8;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            padding: 4px 10px;
            font-size: 11px;
            color: #1a1a1a;
            margin-top: 8px;
            border-radius: 2px;
            min-height: 28px;
            font-family: Tahoma, sans-serif;
        }
        .xp-status .ok { color: #1a6a1a; }
        .xp-status .err { color: #9a2a2a; }

        /* Скролл */
        ::-webkit-scrollbar { width: 16px; background: #d4d0c8; }
        ::-webkit-scrollbar-thumb { background: #c0c0c0; border: 2px solid #808080; border-color: #fff #808080 #808080 #fff; }
        ::-webkit-scrollbar-button { background: #d4d0c8; border: 1px solid #808080; height: 16px; }

        /* Кнопка Пуск (внизу) */
        .xp-start {
            background: #d4d0c8;
            border: 2px solid;
            border-color: #fff #808080 #808080 #fff;
            padding: 4px 16px 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: default;
            margin-top: 8px;
            border-radius: 2px;
            color: #1a1a1a;
        }
        .xp-start img { width: 18px; height: 18px; }

        .xp-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px 0 8px;
            flex-wrap: wrap;
        }
        .xp-clock { font-size: 11px; color: #1a1a1a; background: #d4d0c8; padding: 2px 12px; border: 2px solid; border-color: #808080 #fff #fff #808080; border-radius: 2px; }

        .xp-badge { background: #1a5a9e; color: #fff; padding: 0 8px; border-radius: 10px; font-size: 9px; font-weight: bold; }

        /* Утилиты */
        .mt-1 { margin-top: 6px; }
        .mb-1 { margin-bottom: 6px; }
    </style>
</head>
<body>
<div class="xp-desktop">
    <!-- Заголовок -->
    <div class="xp-titlebar">
        <div class="title">
            <span>🖥️</span>
            SWILL · XP Meta Lab <span class="xp-badge">v3.0</span>
        </div>
        <div class="controls">
            <button style="background:#d4d0c8;">_</button>
            <button style="background:#d4d0c8;">☐</button>
            <button class="close" id="closeBtn">✕</button>
        </div>
    </div>

    <!-- Тело -->
    <div class="xp-window">
        <!-- Загрузка -->
        <div class="xp-panel">
            <div class="xp-panel-title"><span>📂</span> Загрузка файла</div>
            <div class="xp-drop" id="dropZone">
                <div class="icon">🖼️</div>
                <div><strong>Кликни или перетащи файл</strong></div>
                <div style="font-size:11px;color:#606060;">JPG, PNG, GIF, WebP, TIFF, BMP</div>
                <div class="filename" id="fileName">Файл не выбран</div>
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.webp,.tiff,.tif,.bmp">
            </div>
            <img id="previewImg" class="xp-preview" src="" alt="preview">
        </div>

        <!-- Основная сетка -->
        <div class="xp-row">
            <div class="xp-col">
                <div class="xp-panel">
                    <div class="xp-panel-title"><span>📋</span> Метаданные &amp; хеши</div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:11px;" id="statsBar"></div>
                    <div class="xp-meta" id="metaOutput">⏳ Ожидание загрузки...</div>
                    <div class="xp-btn-group">
                        <button class="xp-btn" id="copyBtn">📋 Копировать</button>
                        <button class="xp-btn xp-btn-primary" id="downloadJsonBtn">⬇ Скачать JSON</button>
                        <button class="xp-btn xp-btn-danger" id="clearBtn">✕ Очистить</button>
                    </div>
                </div>
            </div>
            <div class="xp-col">
                <div class="xp-panel">
                    <div class="xp-panel-title"><span>🔍</span> Доп. анализ (строки, LSB)</div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:11px;" id="extraStats"></div>
                    <div class="xp-meta" id="extraOutput" style="max-height:300px;">Здесь будут хеши, LSB, строки...</div>
                    <div class="xp-btn-group">
                        <button class="xp-btn xp-btn-warning" id="refreshBtn">🔄 Обновить</button>
                        <button class="xp-btn" id="copyExtraBtn">📋 Копировать анализ</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Статус -->
        <div class="xp-status" id="status">✅ Готов к работе. Загрузи файл.</div>

        <!-- Нижняя панель с Пуском -->
        <div class="xp-footer">
            <div class="xp-start">
                <span>🪟</span> Пуск
            </div>
            <div class="xp-clock" id="xpClock"></div>
        </div>
    </div>
</div>

<script>
(function(){
    // ========== Часы ==========
    function updateClock() {
        const now = new Date();
        document.getElementById('xpClock').textContent = now.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ========== DOM ==========
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const previewImg = document.getElementById('previewImg');
    const metaOutput = document.getElementById('metaOutput');
    const extraOutput = document.getElementById('extraOutput');
    const statsBar = document.getElementById('statsBar');
    const extraStats = document.getElementById('extraStats');
    const statusDiv = document.getElementById('status');
    const copyBtn = document.getElementById('copyBtn');
    const copyExtraBtn = document.getElementById('copyExtraBtn');
    const downloadJsonBtn = document.getElementById('downloadJsonBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const clearBtn = document.getElementById('clearBtn');
    const closeBtn = document.getElementById('closeBtn');

    let currentFile = null;
    let currentDataUrl = null;
    let currentMeta = null;
    let currentHash = null;
    let currentStrings = [];
    let currentLsbScore = 0;

    // ========== ЗАКРЫТИЕ (имитация) ==========
    closeBtn.addEventListener('click', () => {
        if(confirm('Закрыть SWILL XP Meta Lab?')) {
            document.querySelector('.xp-desktop').style.display = 'none';
            document.body.innerHTML = '<div style="background:#3a6ea5;height:100vh;display:flex;justify-content:center;align-items:center;color:#fff;font-family:Tahoma;font-size:24px;">🖥️ SWILL · завершено</div>';
        }
    });

    // ========== ЗАГРУЗКА ==========
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('click', (e) => e.stopPropagation());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor='#3a6ea5'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='#808080');
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor='#808080';
        if(e.dataTransfer.files && e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });
    fileInput.addEventListener('change', function(e) {
        if(this.files && this.files.length) {
            handleFile(this.files[0]);
        }
        this.value = '';
    });

    function handleFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        const valid = ['jpg','jpeg','png','gif','webp','tiff','tif','bmp'];
        if(!valid.includes(ext)) {
            statusDiv.innerHTML = '<span class="err">❌ Формат не поддерживается</span>';
            return;
        }
        currentFile = file;
        fileName.textContent = '📄 ' + file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)';
        const reader = new FileReader();
        reader.onload = (e) => {
            currentDataUrl = e.target.result;
            previewImg.src = currentDataUrl;
            previewImg.style.display = 'block';
            statusDiv.innerHTML = '<span class="ok">⏳ Анализ...</span>';
            extractEverything(file);
        };
        reader.readAsDataURL(file);
    }

    // ========== ГЛАВНАЯ ЭКСТРАКЦИЯ ==========
    function extractEverything(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const buffer = e.target.result;
            const bytes = new Uint8Array(buffer);
            const view = new DataView(buffer);

            exifr.parse(file, { mergeOutput: true, translateKeys: true, tiff:true, exif:true, iptc:true, xmp:true, png:true, pick:['*'] })
                .then(meta => {
                    if(!meta || Object.keys(meta).length===0) {
                        return readPngTextChunks(file).then(chunks => {
                            if(chunks && Object.keys(chunks).length) meta = chunks;
                            else meta = {};
                            return meta;
                        }).catch(()=>{ meta = {}; return meta; });
                    }
                    return meta;
                })
                .then(meta => {
                    const base = {
                        'Имя файла': file.name,
                        'Размер (байт)': file.size,
                        'MIME-тип': file.type || '—',
                        'Дата изменения': file.lastModified ? new Date(file.lastModified).toISOString() : '—'
                    };
                    const img = new Image();
                    img.onload = function() {
                        base['Ширина (px)'] = this.width;
                        base['Высота (px)'] = this.height;
                        const hist = getColorHistogram(this);
                        if(hist) base['Гистограмма (топ-5)'] = hist;
                        finish(meta, base, bytes, view, file);
                    };
                    img.onerror = function() {
                        finish(meta, base, bytes, view, file);
                    };
                    img.src = currentDataUrl;
                })
                .catch(err => {
                    statusDiv.innerHTML = '<span class="err">❌ ' + err.message + '</span>';
                });
        };
        reader.readAsArrayBuffer(file);
    }

    function finish(meta, base, bytes, view, file) {
        const fullMeta = Object.assign({}, base, meta);
        const cleaned = {};
        for(const k of Object.keys(fullMeta)) {
            const v = fullMeta[k];
            if(v !== undefined && v !== null && v !== '') cleaned[k] = v;
        }
        currentMeta = cleaned;

        // Хеши
        const wordArray = CryptoJS.lib.WordArray.create(bytes);
        currentHash = {
            MD5: CryptoJS.MD5(wordArray).toString(CryptoJS.enc.Hex),
            SHA1: CryptoJS.SHA1(wordArray).toString(CryptoJS.enc.Hex),
            SHA256: CryptoJS.SHA256(wordArray).toString(CryptoJS.enc.Hex)
        };

        // Строки
        currentStrings = extractStrings(bytes);

        // LSB
        currentLsbScore = analyzeLSB(bytes);

        // Рендер
        renderMeta(cleaned);
        renderExtra(currentHash, currentStrings, currentLsbScore);
        renderStats(cleaned);

        statusDiv.innerHTML = '<span class="ok">✅ Готово. Поля: ' + Object.keys(cleaned).length + ', строк: ' + currentStrings.length + '</span>';
    }

    // ========== РЕНДЕР ==========
    function renderMeta(meta) {
        let out = '';
        const sorted = Object.keys(meta).sort();
        for(const k of sorted) {
            let v = meta[k];
            if(typeof v === 'object' && v !== null) {
                try { v = JSON.stringify(v, null, 2); } catch { v = String(v); }
            } else if(typeof v === 'string' && v.length > 500) {
                v = v.substring(0,500) + '…';
            }
            out += `<span class="tag">${k}</span> : <span class="value">${v}</span>\n`;
        }
        metaOutput.innerHTML = out || '⚠️ Нет данных';
    }

    function renderExtra(hash, strings, lsb) {
        let out = '';
        out += '<span class="section">📌 ХЕШИ</span>\n';
        out += `MD5    : ${hash.MD5}\n`;
        out += `SHA1   : ${hash.SHA1}\n`;
        out += `SHA256 : ${hash.SHA256}\n\n`;
        out += `<span class="section">🔍 LSB-аномалии</span>\n`;
        out += `Оценка (0-1): ${lsb.toFixed(4)} `;
        if(lsb > 0.55) out += '(⚠️ возможны скрытые данные)';
        else if(lsb > 0.48) out += '(нормально)';
        else out += '(низкая энтропия)';
        out += '\n\n';
        out += `<span class="section">📝 Извлечённые строки (ASCII, >= 4 симв.)</span>\n`;
        if(strings.length === 0) out += '— не найдено';
        else {
            const unique = [...new Set(strings)];
            const maxShow = 60;
            const shown = unique.slice(0, maxShow);
            for(let s of shown) {
                if(s.length > 80) s = s.substring(0,80) + '…';
                out += `  "${s}"\n`;
            }
            if(unique.length > maxShow) out += `  ... и ещё ${unique.length - maxShow} строк`;
        }
        extraOutput.innerHTML = out;
        extraStats.innerHTML = `<span>🧩 Строк: ${strings.length}</span><span>🔑 Уникальных: ${new Set(strings).size}</span>`;
    }

    function renderStats(meta) {
        const keys = Object.keys(meta);
        const size = new Blob([JSON.stringify(meta)]).size;
        statsBar.innerHTML = `
            <span>🧩 Поля: ${keys.length}</span>
            <span>📦 Мета: ${(size/1024).toFixed(2)} KB</span>
            <span>📷 ${meta.Make || meta.Software || meta.Author || meta.Title || '—'}</span>
            <span>📍 ${meta.GPSLatitude ? 'GPS есть' : '—'}</span>
        `;
    }

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function readPngTextChunks(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const view = new DataView(e.target.result);
                    const result = {};
                    let offset = 8;
                    while(offset < view.byteLength) {
                        const len = view.getUint32(offset);
                        const type = view.getUint32(offset+4);
                        const typeStr = String.fromCharCode((type>>24)&0xFF,(type>>16)&0xFF,(type>>8)&0xFF,type&0xFF);
                        if(typeStr === 'tEXt' || typeStr === 'zTXt' || typeStr === 'iTXt') {
                            let key='', val='', i=0, start=offset+8;
                            while(view.getUint8(start+i)!==0) { key += String.fromCharCode(view.getUint8(start+i)); i++; }
                            let j=i+1;
                            if(typeStr==='zTXt') j+=1;
                            if(typeStr==='iTXt') { j += 2 + view.getUint8(start+i+2) + 1; }
                            while(j<len && view.getUint8(start+j)!==0) { val += String.fromCharCode(view.getUint8(start+j)); j++; }
                            if(key) result[key] = val || '(пусто)';
                        }
                        offset += 12 + len;
                        if(offset >= view.byteLength) break;
                    }
                    resolve(result);
                } catch(err) { reject(err); }
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    function getColorHistogram(img, sample=10000) {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = Math.min(img.width, 120);
            canvas.height = Math.min(img.height, 120);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const colorMap = {};
            for(let i=0; i<data.length; i+=4) {
                const r=data[i], g=data[i+1], b=data[i+2];
                const key = `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
                colorMap[key] = (colorMap[key]||0)+1;
            }
            const sorted = Object.entries(colorMap).sort((a,b) => b[1]-a[1]).slice(0,5);
            return sorted.map(([c,n]) => `${c} (${n})`).join(', ');
        } catch { return '—'; }
    }

    function extractStrings(bytes, minLen=4) {
        let str = '';
        const result = [];
        for(let i=0; i<bytes.length; i++) {
            const c = bytes[i];
            if(c >= 32 && c <= 126) {
                str += String.fromCharCode(c);
            } else {
                if(str.length >= minLen) result.push(str);
                str = '';
            }
        }
        if(str.length >= minLen) result.push(str);
        return result;
    }

    function analyzeLSB(bytes, sample=50000) {
        let ones = 0, total = 0;
        const limit = Math.min(bytes.length, sample);
        for(let i=0; i<limit; i++) {
            ones += bytes[i] & 1;
            total++;
        }
        const ratio = ones / total;
        return Math.abs(ratio - 0.5) * 2;
    }

    // ========== КНОПКИ ==========
    copyBtn.addEventListener('click', () => {
        if(!currentMeta) { statusDiv.innerHTML='<span class="err">❌ Нет данных</span>'; return; }
        const text = JSON.stringify(currentMeta, null, 2);
        navigator.clipboard.writeText(text).then(() => statusDiv.innerHTML='<span class="ok">✅ Скопировано</span>')
            .catch(() => { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); statusDiv.innerHTML='<span class="ok">✅ Скопировано (fallback)</span>'; });
    });

    copyExtraBtn.addEventListener('click', () => {
        const text = extraOutput.textContent;
        if(!text) { statusDiv.innerHTML='<span class="err">❌ Нет данных</span>'; return; }
        navigator.clipboard.writeText(text).then(() => statusDiv.innerHTML='<span class="ok">✅ Анализ скопирован</span>')
            .catch(() => { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); statusDiv.innerHTML='<span class="ok">✅ Анализ скопирован (fallback)</span>'; });
    });

    downloadJsonBtn.addEventListener('click', () => {
        if(!currentMeta) { statusDiv.innerHTML='<span class="err">❌ Нет данных</span>'; return; }
        const full = { metadata: currentMeta, hashes: currentHash, strings: currentStrings, lsb_anomaly_score: currentLsbScore };
        const json = JSON.stringify(full, null, 2);
        const blob = new Blob([json], { type:'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'swill_xp_extract.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        statusDiv.innerHTML='<span class="ok">✅ JSON скачан</span>';
    });

    refreshBtn.addEventListener('click', () => {
        if(!currentFile) { statusDiv.innerHTML='<span class="err">❌ Загрузи файл</span>'; return; }
        extractEverything(currentFile);
    });

    clearBtn.addEventListener('click', () => {
        currentFile = null; currentDataUrl = null; currentMeta = null; currentHash = null;
        currentStrings = []; currentLsbScore = 0;
        previewImg.style.display = 'none';
        previewImg.src = '';
        fileName.textContent = 'Файл не выбран';
        metaOutput.textContent = 'Очищено';
        extraOutput.textContent = 'Очищено';
        statsBar.innerHTML = '';
        extraStats.innerHTML = '';
        statusDiv.innerHTML = '✅ Готов.';
        fileInput.value = '';
    });

})();
</script>
